name: Windows compatibility

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Windows runs DataBrain inside WSL 2 (Ubuntu), so a real Ubuntu machine is the test bed:
  # the shared engine in macOS/bin must work there with no PATH tweaks (bin/compat.sh).
  wsl-compatible-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ripgrep sqlite3
      - run: python -m unittest discover -s Windows/tests -v
        working-directory: Terminal version (recommended)
