name: Windows compatibility

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-shims:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest windows/tests/test_shims.py -v

  wsl-compatible-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ripgrep sqlite3
      - run: python -m unittest windows/tests/test_wsl_compat.py -v
